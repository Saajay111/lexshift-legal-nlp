[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexshift"
version = "0.1.0"
description = "Research utilities for evaluating distribution shift in legal clause extraction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License to be determined" }
authors = [{ name = "LEXSHIFT Research Project" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
]

[project.scripts]
lexshift-audit-cuad = "lexshift.cuad_audit:main"
lexshift-convert-cuad = "lexshift.cuad_convert:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
